<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnSeñas – Prototipo interactivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#0B6467;--acc-d:#0B4F52;--ink:#17262B;--ink2:#24353A;--mut:#3E4D53;--mut2:#56656B;--line:#D7E1E2;--bg:#EEF3F3;--soft:#F4F7F7;--red:#C2321F}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#CBD6D8;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
.lex{font-family:Lexend,sans-serif}
/* Barra del prototipo */
#protobar{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#17262B;color:#fff;z-index:20}
#protobar .ttl{font-family:Lexend,sans-serif;font-weight:600;font-size:16px}
#protobar .ttl span{opacity:.7;font-weight:500}
.seg{display:flex;background:#2C3E44;border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;color:#DCE6E7;height:38px;padding:0 14px;border-radius:9px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.pbtn{border:1px solid #4A5E64;background:transparent;color:#fff;height:38px;padding:0 12px;border-radius:10px;font-weight:700;font-size:14px}
#stage{position:fixed;left:0;right:0;bottom:0;top:56px;display:flex;align-items:center;justify-content:center;overflow:hidden}
body.nobar #protobar{display:none}
body.nobar #stage{top:0}
#scaler{transform-origin:center center}
#device{position:relative;background:var(--bg);overflow:hidden;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
/* Comunes */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center}
.logo{width:40px;height:40px;border-radius:11px;background:var(--acc);display:flex;align-items:center;justify-content:center}
.brand{font-family:Lexend,sans-serif;font-weight:700;font-size:22px;letter-spacing:-.3px}
.brand b{color:var(--acc);font-weight:700}
.vsep{width:1px;height:30px;background:var(--line)}
.hosp{width:36px;height:36px;border-radius:50%;border:1.5px dashed #8A9AA0;display:flex;align-items:center;justify-content:center;color:#5B6A70}
.who{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:var(--soft)}
.av{width:34px;height:34px;border-radius:50%;background:#D5E9E9;color:var(--acc-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.sess{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:#E3F2EC;color:#1C5E43;font-size:13px;font-weight:700}
.sess i{width:8px;height:8px;border-radius:50%;background:#2E8B62}
.ibtn{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.card{background:#fff;border:1px solid var(--line);border-radius:22px}
.vid{position:relative;border-radius:16px;background:#163C3E;overflow:hidden;display:flex;align-items:center;justify-content:center}
.play{position:relative;border-radius:50%;border:none;background:#fff;color:#163C3E;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.chip{position:absolute;top:12px;left:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92);color:#163C3E;font-size:13px;font-weight:700}
.playing-bar{position:absolute;left:0;bottom:0;height:5px;background:#F2B705;animation:prog 3s linear forwards}
@keyframes prog{from{width:0}to{width:100%}}
.primary{border:none;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.ghost{border:1px solid var(--line);background:#fff;color:var(--ink2);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.nav{display:flex;align-items:center;gap:12px;padding:16px 32px 20px;background:#fff;border-top:1px solid var(--line)}
.nav .lab{font-size:14px;font-weight:700;color:var(--mut2)}
.navbtn{flex:1 1 0;height:64px;border-radius:16px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700}
.help{width:64px;height:64px;flex:0 0 auto;border-radius:50%;border:2px solid var(--acc);background:#fff;color:var(--acc);display:flex;align-items:center;justify-content:center}
.overlay{position:absolute;inset:0;background:rgba(12,28,31,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:32px;z-index:5}
.dialog{position:relative;width:480px;background:#fff;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#17262B;color:#fff;padding:14px 20px;border-radius:14px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgba(37,99,235,.45);border:2px solid rgba(30,64,175,.9);pointer-events:none;z-index:9}
.dot.miss{background:rgba(242,183,5,.5);border-color:#9A6A00}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,50,31,.5)}50%{box-shadow:0 0 0 14px rgba(194,50,31,0)}}
/* Panel de test */
#tp{position:fixed;right:16px;bottom:16px;z-index:50;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:#2B2200}
#tp .box{width:360px;max-height:calc(100vh - 32px);overflow:auto;background:#FFF4C2;border:2px solid #E0B400;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
#tp .th{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FFE58A;border-bottom:1px solid #E8CB55;position:sticky;top:0}
#tp .th b{flex:1;font-family:Lexend,sans-serif;font-size:15px}
#tp .tb{padding:12px;display:flex;flex-direction:column;gap:12px}
#tp .sm{width:34px;height:34px;border-radius:9px;border:1px solid #D9B52E;background:#FFF8D9;display:flex;align-items:center;justify-content:center}
#tp label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#5C4A00}
#tp input[type=text],#tp select,#tp textarea{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid #D9B52E;background:#fff;color:#2B2200}
#tp textarea{resize:vertical;min-height:54px}
#tp label.f{min-width:0}#tp select,#tp input[type=text]{width:100%;min-width:0}
#tp .timer{font-family:Lexend,sans-serif;font-weight:700;font-size:38px;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.5px}
#tp .st{font-size:12px;text-align:center;font-weight:700;color:#7A6200}
#tp .btns{display:flex;gap:8px}
#tp .btns button{flex:1;height:40px;border-radius:10px;border:1px solid #C9A21C;background:#fff;font-weight:700;font-size:14px}
#tp .btns button.go{background:#2B2200;color:#FFE58A;border-color:#2B2200}
#tp .btns button.ok{background:#1C6E4A;color:#fff;border-color:#1C6E4A}
#tp .btns button.no{background:#fff;color:#8A2216;border-color:#D59A90}
#tp .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
#tp .stat{background:#fff;border:1px solid #E8CB55;border-radius:10px;padding:6px 8px}
#tp .stat .n{font-family:Lexend,sans-serif;font-weight:700;font-size:20px}
#tp .stat .l{font-size:11px;color:#5C4A00;font-weight:700}
#tp .stat button{border:1px solid #C9A21C;background:#FFF8D9;border-radius:6px;font-size:12px;font-weight:700;padding:0 6px;height:22px}
#tp .opt{display:flex;align-items:center;gap:8px;font-size:13px}
#tp .sec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#7A6200}
#tp table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:8px;overflow:hidden}
#tp td,#tp th{padding:5px 6px;border-bottom:1px solid #F0DE95;text-align:left}
#tp .mini{position:fixed;right:16px;bottom:16px;height:52px;min-width:52px;padding:0 14px;border-radius:999px;border:2px solid #E0B400;background:#FFE58A;color:#2B2200;display:flex;align-items:center;gap:8px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tp .rec{width:10px;height:10px;border-radius:50%;background:#C2321F}
#tp .csv{width:100%;height:90px;font-family:monospace;font-size:11px}
#protobar .seg button{position:relative}
.badge{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;background:#F2B705;box-shadow:0 0 0 2px #17262B}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid #D5E9E9;border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hotspot{position:fixed;right:0;bottom:0;width:56px;height:56px;z-index:49}
</style>
</head>
<body>
<div id="protobar">
  <div class="ttl">enSeñas <span>· Prototipo interactivo</span></div>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-view="medico">Médico</button>
    <button type="button" data-view="paciente">Paciente</button>
  </div>
  <div style="flex:1"></div>
  <button type="button" class="pbtn" id="resetProto">Reiniciar prototipo</button>
</div>
<div id="stage"><div id="scaler"><div id="device"></div></div></div>
<div id="tp"></div>
<div id="hotspot" hidden></div>

   '<label class="opt"><input type="checkbox" id="tpAuto"'+(T.auto?' checked':'')+'> Terminar sola al cumplir la tarea</label>'+
   '<label class="opt"><input type="checkbox" id="tpHeat"'+(T.heat?' checked':'')+'> Mostrar mapa de clics (azul: botón · amarillo: fuera)</label>'+
   '<label class="opt"><input type="checkbox" id="tpFrame"'+(T.outFrame?' checked':'')+'> Simular «fuera del marco» en la cámara</label>'+
   '<label class="opt"><input type="checkbox" id="tpBar"'+(document.body.classList.contains('nobar')?' checked':'')+'> Ocultar barra superior del prototipo</label>'+
   '<div class="sec">Resultados ('+T.results.length+')</div>'+summary()+
   '<div class="btns"><button type="button" data-t="dl">Descargar CSV</button><button type="button" data-t="copy">Copiar CSV</button><button type="button" data-t="clear">Borrar</button></div>'+
   (T.csvShown?'<textarea class="csv" readonly aria-label="Datos CSV">'+esc(csv())+'</textarea>':'')+
   '<div id="tpMsg" style="font-size:12px;min-height:14px"></div>'+
   '<div style="font-size:11px;color:#7A6200">Los resultados se guardan solo en este navegador. Atajo: Ctrl+Shift+T muestra u oculta el panel.</div>'+
  '</div></div>';
}
function msg(t){var el=document.getElementById('tpMsg');if(el)el.textContent=t;}
var confirmClear=false;
tp.addEventListener('click',async function(e){
  var b=e.target.closest('[data-t]');if(!b||b.disabled)return;var t=b.dataset.t;
  if(t==='open')setMode('open');
  else if(t==='mini')setMode('mini');
  else if(t==='hide')setMode('hidden');
  else if(t==='start')startT();
  else if(t==='pause')pauseT();
  else if(t==='reset')resetT();
  else if(t==='err+'){T.errors++;updateCounters();}
  else if(t==='err-'){T.errors=Math.max(0,T.errors-1);updateCounters();}
  else if(t==='ok')finishT('Completada');
  else if(t==='fail')finishT('No completada');
  else if(t==='view'){var task=TASKS.filter(function(x){return x.id===T.task;})[0];setView(task.v);renderPanel();}
  else if(t==='copy'){try{await navigator.clipboard.writeText(csv());msg('CSV copiado. Pégalo en una planilla.');}catch(err){T.csvShown=true;renderPanel();msg('No se pudo copiar: selecciona el texto y cópialo.');}}
  else if(t==='dl'){var dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;}catch(err){dl=null;}
    if(dl){try{await dl.save({filename:'ensenas-test-'+new Date().toISOString().slice(0,10)+'.csv',data:'﻿'+csv()});msg('Archivo listo.');}catch(err){msg('Descarga cancelada.');}}
    else{T.csvShown=true;renderPanel();msg('La descarga no está disponible aquí: copia el texto del recuadro.');}}
  else if(t==='clear'){if(!confirmClear){confirmClear=true;msg('Toca «Borrar» otra vez para eliminar todos los resultados.');setTimeout(function(){confirmClear=false;},4000);}else{confirmClear=false;T.results=[];store.set('results',[]);T.csvShown=false;renderPanel();msg('Resultados borrados.');}}
});
tp.addEventListener('input',function(e){
  if(e.target.id==='tpPart'){T.participant=e.target.value;store.set('participant',T.participant);}
  if(e.target.id==='tpNotes'){T.notes=e.target.value;}
});
tp.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='tpTask'){T.task=e.target.value;renderPanel();}
  if(id==='tpAuto')T.auto=e.target.checked;
  if(id==='tpHeat'){T.heat=e.target.checked;render();}
  if(id==='tpFrame'){T.outFrame=e.target.checked;render();}
  if(id==='tpBar'){document.body.classList.toggle('nobar',e.target.checked);layout();}
});
document.addEventListener('keydown',function(e){if(e.ctrlKey&&e.shiftKey&&(e.key==='T'||e.key==='t')){e.preventDefault();setMode(T.mode==='hidden'?'open':'hidden');}});
var hotTaps=[];hot.addEventListener('click',function(){var n=Date.now();hotTaps=hotTaps.filter(function(x){return n-x<900;});hotTaps.push(n);if(hotTaps.length>=3){hotTaps=[];setMode('open');}});
setInterval(function(){if(T.running){var el=document.getElementById('tpt');if(el)el.textContent=fmt(elapsed());}},100);

// ---------- Inicio ----------
render();layout();renderPanel();
})();
</script>
</body>
</html>
